$kind: http-request
description: Rotates the refresh token. The test script replaces both saved tokens.
url: "{{baseUrl}}/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{refreshToken}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
        const body = pm.response.json();
        if (body.accessToken) pm.environment.set('accessToken', body.accessToken);
        if (body.refreshToken) pm.environment.set('refreshToken', body.refreshToken);
      }
    language: text/javascript
order: 3000
