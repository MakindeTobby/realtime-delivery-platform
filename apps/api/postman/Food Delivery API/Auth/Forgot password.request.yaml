$kind: http-request
description: Always returns a generic response for existing and unknown email addresses. Requires RESEND_API_KEY, EMAIL_FROM, and PASSWORD_RESET_URL on the API.
url: "{{baseUrl}}/auth/forgot-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "ada@example.com"
    }
auth:
  type: noauth
order: 5000
