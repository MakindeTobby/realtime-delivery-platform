$kind: http-request
description: Reset token expires after 30 minutes and is single use. Successful reset revokes all sessions.
url: "{{baseUrl}}/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "token": "{{passwordResetToken}}",
      "password": "newpassword123"
    }
auth:
  type: noauth
order: 6000
