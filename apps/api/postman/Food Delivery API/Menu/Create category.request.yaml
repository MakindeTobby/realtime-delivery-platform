$kind: http-request
url: "{{baseUrl}}/menu/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Pasta"
    }
auth:
  type: bearer
  credentials:
    token: "{{ownerAccessToken}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201 || pm.response.code === 200) {
        const body = pm.response.json();
        if (body.id) pm.environment.set('categoryId', body.id);
      }
    language: text/javascript
order: 1000
